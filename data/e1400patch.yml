id: e1400patch
name: europa1400-patches (patch loader and patch modules, needs europa1400-manager 1.2 or newer)
# version: keep in step with the europa1400-patches release (the URLs always point to the latest release).
elements:
  - id: e1400patch
    name: E1400 Patch Loader
    type: e1400patch_loader
    url: https://github.com/europa1400-community/europa1400-patches/releases/latest/download/e1400patch.zip
    version: 0.1.0
    category: tools
    author: europa1400-community
    homepage: https://github.com/europa1400-community/europa1400-patches
    description:
      en: >-
        Loads community patches into the game without replacing game files. Installed automatically with the patches
        that need it.
      de: >-
        Lädt Community-Patches ins Spiel, ohne Spieldateien zu ersetzen. Wird mit den Patches, die ihn brauchen,
        automatisch installiert.
  - id: netfix
    name: Netfix (multiplayer host)
    type: e1400patch_module
    url: https://github.com/europa1400-community/europa1400-patches/releases/latest/download/netfix.zip
    version: 0.1.0
    requires:
      - e1400patch
    conflicts:
      - networkfix
    category: multiplayer
    author: europa1400-community
    homepage: https://github.com/europa1400-community/europa1400-patches/blob/main/patches/netfix/README.md
    description:
      en: >-
        For the player who hosts a multiplayer game (the others need nothing). Over VPNs and the Internet game
        messages often arrive in pieces, which the server of the game cannot handle; Netfix makes it wait for complete
        messages and answer faster.
      de: >-
        Für den Spieler, der ein Mehrspielerspiel hostet (die anderen brauchen nichts). Über VPNs und das Internet
        kommen Spielnachrichten oft in Stücken an, womit der Server des Spiels nicht umgehen kann; Netfix lässt ihn auf
        vollständige Nachrichten warten und schneller antworten.
  - id: gfxfix
    name: Gfxfix (monitor choice and texture fix)
    type: archive
    url: https://github.com/europa1400-community/europa1400-patches/releases/latest/download/gfxfix.zip
    version: 0.1.0
    file_name:
      - d3d8.dll
      - gfxfix.ini
    conflicts:
      - dxwrapper
    category: graphics
    author: europa1400-community
    homepage: https://github.com/europa1400-community/europa1400-patches/blob/main/package/MONITORFIX.txt
    description:
      en: >-
        For PCs with several monitors: the game remembers its graphics choice by graphics card only and therefore
        always starts on the last monitor. Gfxfix shows the game exactly one monitor; choose which in the game
        settings of the manager (or monitor= in gfxfix.ini). Not compatible with DxWrapper (both use d3d8.dll); it also fixes the cut-off interface graphics (POW2 texture caps), so DxWrapper is not needed.
      de: >-
        Für PCs mit mehreren Bildschirmen: Das Spiel merkt sich seine Grafikauswahl nur pro Grafikkarte und startet
        deshalb immer auf dem letzten Bildschirm. Gfxfix zeigt dem Spiel genau einen Bildschirm; welchen, stellst
        du in den Spieleinstellungen des Managers ein (oder monitor= in gfxfix.ini). Nicht kombinierbar mit
        DxWrapper (beide nutzen d3d8.dll); behebt außerdem die abgeschnittenen Oberflächengrafiken (POW2-Texturcaps), DxWrapper ist dafür nicht nötig.
  - id: monitorfix
    name: Monitorfix (old, replaced by Gfxfix)
    type: archive
    url: https://github.com/europa1400-community/europa1400-patches/releases/latest/download/gfxfix.zip
    file_name:
      - d3d8.dll
      - monitorfix.ini
    conflicts:
      - gfxfix
      - dxwrapper
    category: graphics
    author: europa1400-community
    homepage: https://github.com/europa1400-community/europa1400-patches
    description:
      en: >-
        Old name of Gfxfix, kept only so that it can be uninstalled. Uninstall it, then install Gfxfix.
      de: >-
        Alter Name von Gfxfix, nur noch da, damit man ihn deinstallieren kann. Deinstalliere ihn und installiere dann
        Gfxfix.
