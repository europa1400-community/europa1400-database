id: executable_to_metadata
name: Executable to Metadata Mappings
elements:
  - id: gilde
    executable: gilde
    metadata:
      edition: standard
      language: de
  - id: gilde_gold
    executable: gilde_gold
    metadata:
      edition: gold
      language: de
  # Europa1400*.exe: English GOG and retail, but also the German Steam version, so no language here
  - id: europa1400
    executable: europa1400
    metadata:
      edition: standard
  - id: europa1400_gold
    executable: europa1400_gold
    metadata:
      edition: gold

